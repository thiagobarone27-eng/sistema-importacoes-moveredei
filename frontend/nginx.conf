server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estaticos com cache longo (o build do Vite usa hash no nome do arquivo)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy de API: o container do frontend encaminha /api para o backend,
    # assim o app funciona em qualquer dominio sem precisar saber o host do backend.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # SPA: qualquer rota que nao seja arquivo real cai no index.html (React Router)
    location / {
        try_files $uri /index.html;
    }
}
